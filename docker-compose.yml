services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_SA_PASSWORD:?defina DB_SA_PASSWORD no .env}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=PlataformaEnsinoDB;User Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True;"
      Jwt__Key: "${JWT_KEY:?defina JWT_KEY no .env (minimo 32 caracteres)}"
      RunMigrationsOnStartup: "true"
      Cors__AllowedOrigins__0: "http://localhost:5173"
      Cors__AllowedOrigins__1: "http://localhost:8081"
    ports:
      - "5000:8080"
    volumes:
      - uploads-data:/app/Storage/Uploads

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    depends_on:
      - api
    environment:
      DOTNET_API_URL: "http://api:8080"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:8081"
    ports:
      - "4000:4000"

volumes:
  sqlserver-data:
  uploads-data:
