name: Deploy to Azure

# So dispara depois que o workflow "CI" (ci.yml) terminar com sucesso na
# main - nunca publica codigo que nao passou nos testes. workflow_dispatch
# fica disponivel pra redisparar manualmente (ex.: reaplicar o mesmo build
# sem precisar de um commit novo).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # Builda a partir do codigo-fonte atual, nunca confia no wwwroot/
      # commitado - ver Dockerfile (mesmo racional) e o relatorio de
      # auditoria de prontidao para Azure.
      - name: Build do frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish da API
        run: dotnet publish "Sistema Academico Integrado.csproj" -c Release -o ./publish

      # Autenticacao via publish profile (credencial do proprio App Service,
      # tipo usuario/senha do Kudu) em vez de login OIDC com Service
      # Principal: o tenant Azure da UNIP bloqueia usuarios comuns de criar
      # App Registrations, entao o fluxo original com azure/login nao e
      # viavel aqui. Sem login no az CLI no runner, as migrations no Azure
      # SQL NAO sao aplicadas automaticamente por este workflow - rodar
      # manualmente apos qualquer alteracao de schema (ver infra/README.md).
      - name: Deploy no App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
